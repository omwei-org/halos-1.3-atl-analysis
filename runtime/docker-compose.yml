services:
  magic-box:
    build:
      context: ..
      dockerfile: runtime/Dockerfile
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      MAGIC_BOX_HOST: 0.0.0.0
      MAGIC_BOX_PORT: 8080
      MAGIC_BOX_IO_SOCKET: /run/equinibrium/magic-box-io.sock
    volumes:
      - equinibrium-run:/run/equinibrium
    depends_on:
      - host-io

  host-io:
    build:
      context: ..
      dockerfile: runtime/Dockerfile
    command: ["python", "-m", "runtime.host_io"]
    restart: unless-stopped
    environment:
      MAGIC_BOX_IO_SOCKET: /run/equinibrium/magic-box-io.sock
    volumes:
      - equinibrium-run:/run/equinibrium

volumes:
  equinibrium-run:
