name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r runtime/requirements.txt pytest

      - name: Run test suite
        run: python -m pytest -q

      - name: Capture Run 002 evidence
        run: PYTHONPATH=. python scripts/run_run002.py

      - name: Hash Run 002 evidence
        run: sha256sum run-002-evidence.json > run-002-evidence.sha256

      - name: Upload Run 002 evidence
        uses: actions/upload-artifact@v4
        with:
          name: run-002-evidence
          path: |
            run-002-evidence.json
            run-002-evidence.sha256
